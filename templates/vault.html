<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Vault</title>
<style>
  :root{
    --bg:#0A0A0A; --panel:#121212; --panel-2:#161616; --line:#232323;
    --cyan:#00D4FF; --gold:#FFD700;
    --text:rgba(255,255,255,0.80); --text-hi:rgba(255,255,255,0.98); --text-lo:rgba(255,255,255,0.45);
    --green:#7CFF8A; --amber:#FFB020; --red:#ff6b6b;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  .wrap{max-width:1180px;margin:0 auto;padding:36px 24px 80px;}
  header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:24px;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase;margin-bottom:8px;}
  h1{font-size:26px;color:var(--text-hi);margin:0 0 6px;font-weight:600;}
  .sub{color:var(--text-lo);font-size:13px;}
  .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:22px 0;}
  .stat{background:var(--panel);padding:14px 16px;}
  .stat .n{font-family:var(--mono);font-size:22px;font-weight:600;}
  .stat .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-lo);margin-top:2px;}
  .stat.raw .n{color:var(--text-lo);}
  .stat.cleaning .n{color:var(--gold);}
  .stat.ready .n{color:var(--cyan);}
  .stat.error .n{color:var(--red);}
  .stat.total .n{color:var(--text-hi);}

  .controls{display:flex;gap:10px;margin-bottom:16px;}
  #search{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:9px 12px;font-size:13px;border-radius:3px;}
  #search:focus{outline:1px solid var(--cyan);}
  select{background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:9px 12px;font-size:13px;border-radius:3px;}

  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);}
  thead th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-lo);padding:10px 14px;border-bottom:1px solid var(--line);}
  tbody tr{border-bottom:1px solid var(--line);cursor:pointer;}
  tbody tr:hover{background:var(--panel-2);}
  tbody td{padding:11px 14px;font-size:13px;vertical-align:middle;}
  .badge{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:20px;display:inline-block;}
  .badge.raw{background:rgba(255,255,255,0.08);color:var(--text-lo);}
  .badge.cleaning{background:rgba(255,215,0,0.12);color:var(--gold);}
  .badge.ready_for_scripting{background:rgba(0,212,255,0.12);color:var(--cyan);}
  .badge.error{background:rgba(255,107,107,0.12);color:var(--red);}
  .badge.empty{background:rgba(255,176,32,0.1);color:var(--amber);}
  .counts{font-family:var(--mono);font-size:11.5px;color:var(--text-lo);}
  .counts b{color:var(--text-hi);}
  .updated{font-family:var(--mono);font-size:11px;color:var(--text-lo);}

  .empty-state{padding:60px 20px;text-align:center;color:var(--text-lo);font-size:13px;}

  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:6px;max-width:760px;width:92%;max-height:80vh;overflow-y:auto;padding:24px;}
  .modal h3{color:var(--text-hi);margin:0 0 4px;font-size:16px;}
  .modal .modal-sub{font-family:var(--mono);font-size:11px;color:var(--text-lo);margin-bottom:16px;}
  .modal-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .modal-tab{background:var(--panel-2);border:1px solid var(--line);color:var(--text-lo);padding:6px 14px;font-size:12px;border-radius:3px;cursor:pointer;}
  .modal-tab.active{border-color:var(--cyan);color:var(--text-hi);}
  .modal-close{float:right;background:none;border:none;color:var(--text-lo);font-size:20px;cursor:pointer;line-height:1;}
  .modal-close:hover{color:var(--text-hi);}
  .preview-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .preview-table th,.preview-table td{border:1px solid var(--line);padding:6px 8px;text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .preview-table th{color:var(--text-lo);font-family:var(--mono);font-size:10px;text-transform:uppercase;}
  .prompt-box{background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:14px;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--text);white-space:pre-wrap;max-height:340px;overflow-y:auto;}
  .copy-btn{margin-top:12px;background:var(--cyan);color:#000;border:none;padding:8px 18px;font-size:12px;font-weight:600;border-radius:3px;cursor:pointer;}
  .copy-btn:hover{background:#33dcff;}
  .copy-status{font-family:var(--mono);font-size:11px;color:var(--green);margin-left:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow"><span class="live-dot"></span>Infrastructure &amp; Power — Research Layer</div>
    <h1>Knowledge Vault</h1>
    <div class="sub">Live view of everything Research Hunter found and the Orchestrator has processed.</div>
  </header>

  <div class="stats" id="statsRow"></div>

  <div class="controls">
    <input id="search" type="text" placeholder="Search by topic…">
    <select id="stageFilter">
      <option value="">All stages</option>
      <option value="raw">Raw</option>
      <option value="cleaning">Cleaning</option>
      <option value="ready_for_scripting">Ready for Scripting</option>
      <option value="empty">Empty</option>
      <option value="error">Error</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Topic</th>
        <th>Stage</th>
        <th>Raw → Curated</th>
        <th>Removed</th>
        <th>Updated</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div id="emptyState" class="empty-state" style="display:none;">Nothing here yet — run a search in Research Hunter and save it to see it appear.</div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <button class="modal-close" id="modalClose">×</button>
    <h3 id="modalTitle"></h3>
    <div class="modal-sub" id="modalSub"></div>
    <div class="modal-tabs">
      <div class="modal-tab active" data-tab="preview">Preview Data</div>
      <div class="modal-tab" data-tab="prompt">Ingestion Prompt</div>
    </div>
    <div id="tabPreview"></div>
    <div id="tabPrompt" style="display:none;"></div>
  </div>
</div>

<script>
let STATE = {};
let currentItemId = null;

function fmtDate(iso){
  if(!iso) return "—";
  try{ return new Date(iso).toLocaleString(); }catch(e){ return iso; }
}

function badgeLabel(stage){
  const labels = {
    raw:"Raw", cleaning:"Cleaning", ready_for_scripting:"Ready", empty:"Empty", error:"Error"
  };
  return labels[stage] || stage;
}

function renderStats(items){
  const counts = { raw:0, cleaning:0, ready_for_scripting:0, error:0 };
  Object.values(items).forEach(it=>{ if(counts[it.stage] !== undefined) counts[it.stage]++; });
  const total = Object.keys(items).length;
  document.getElementById("statsRow").innerHTML = `
    <div class="stat total"><div class="n">${total}</div><div class="l">Total Items</div></div>
    <div class="stat raw"><div class="n">${counts.raw}</div><div class="l">Raw</div></div>
    <div class="stat cleaning"><div class="n">${counts.cleaning}</div><div class="l">Cleaning</div></div>
    <div class="stat ready"><div class="n">${counts.ready_for_scripting}</div><div class="l">Ready for Scripting</div></div>
    <div class="stat error"><div class="n">${counts.error}</div><div class="l">Errors</div></div>
  `;
}

function renderTable(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const stageVal = document.getElementById("stageFilter").value;
  const items = STATE.items || {};
  const entries = Object.entries(items)
    .filter(([id, it])=>{
      if(q && !((it.query||"").toLowerCase().includes(q))) return false;
      if(stageVal && it.stage !== stageVal) return false;
      return true;
    })
    .sort((a,b)=> new Date(b[1].updated_at||0) - new Date(a[1].updated_at||0));

  const body = document.getElementById("tableBody");
  const emptyState = document.getElementById("emptyState");

  if(entries.length === 0){
    body.innerHTML = "";
    emptyState.style.display = "block";
    return;
  }
  emptyState.style.display = "none";

  body.innerHTML = entries.map(([id, it])=>`
    <tr data-id="${id}">
      <td>${it.query || id}</td>
      <td><span class="badge ${it.stage}">${badgeLabel(it.stage)}</span></td>
      <td class="counts"><b>${it.raw_count ?? "—"}</b> → <b>${it.curated_count ?? "—"}</b></td>
      <td class="counts">${(it.dropped_incomplete||0) + (it.duplicates_removed||0)}</td>
      <td class="updated">${fmtDate(it.updated_at)}</td>
    </tr>
  `).join("");

  body.querySelectorAll("tr").forEach(row=>{
    row.addEventListener("click", ()=> openModal(row.dataset.id));
  });
}

async function pollStatus(){
  try{
    const resp = await fetch("/api/status");
    STATE = await resp.json();
    renderStats(STATE.items || {});
    renderTable();
  }catch(e){ console.error("status poll failed", e); }
}

document.getElementById("search").addEventListener("input", renderTable);
document.getElementById("stageFilter").addEventListener("change", renderTable);

function openModal(itemId){
  currentItemId = itemId;
  const it = (STATE.items || {})[itemId];
  document.getElementById("modalTitle").textContent = it.query || itemId;
  document.getElementById("modalSub").textContent = `${badgeLabel(it.stage)} · ${it.curated_count ?? 0} curated results`;
  document.querySelectorAll(".modal-tab").forEach(t=>t.classList.toggle("active", t.dataset.tab === "preview"));
  document.getElementById("tabPreview").style.display = "block";
  document.getElementById("tabPrompt").style.display = "none";
  loadPreview(itemId);
  document.getElementById("modalBackdrop").classList.add("open");
}

async function loadPreview(itemId){
  const el = document.getElementById("tabPreview");
  el.innerHTML = `<div style="color:var(--text-lo);font-family:var(--mono);font-size:12px;">Loading…</div>`;
  try{
    const resp = await fetch(`/api/preview/${itemId}`);
    if(!resp.ok){
      el.innerHTML = `<div style="color:var(--text-lo);font-family:var(--mono);font-size:12px;">No curated data yet — still processing.</div>`;
      return;
    }
    const data = await resp.json();
    if(!data.rows.length){
      el.innerHTML = `<div style="color:var(--text-lo);font-family:var(--mono);font-size:12px;">No rows.</div>`;
      return;
    }
    const cols = Object.keys(data.rows[0]);
    el.innerHTML = `
      <table class="preview-table">
        <thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
        <tbody>${data.rows.map(r=>`<tr>${cols.map(c=>`<td title="${(r[c]||"").replace(/"/g,'&quot;')}">${r[c]||""}</td>`).join("")}</tr>`).join("")}</tbody>
      </table>
      <div style="font-family:var(--mono);font-size:10.5px;color:var(--text-lo);margin-top:10px;">${data.path}</div>
    `;
  }catch(e){
    el.innerHTML = `<div style="color:var(--red);font-family:var(--mono);font-size:12px;">Failed to load preview.</div>`;
  }
}

async function loadPrompt(itemId){
  const el = document.getElementById("tabPrompt");
  el.innerHTML = `<div style="color:var(--text-lo);font-family:var(--mono);font-size:12px;">Loading…</div>`;
  try{
    const resp = await fetch(`/api/prompt/${itemId}`);
    const data = await resp.json();
    el.innerHTML = `
      <div class="prompt-box">${data.prompt}</div>
      <button class="copy-btn" id="copyPromptBtn">Copy prompt</button>
      <span class="copy-status" id="copyStatus" style="display:none;">✓ copied</span>
    `;
    document.getElementById("copyPromptBtn").addEventListener("click", ()=>{
      navigator.clipboard.writeText(data.prompt).then(()=>{
        const status = document.getElementById("copyStatus");
        status.style.display = "inline";
        setTimeout(()=> status.style.display = "none", 2000);
      });
    });
  }catch(e){
    el.innerHTML = `<div style="color:var(--red);font-family:var(--mono);font-size:12px;">Failed to load prompt.</div>`;
  }
}

document.querySelectorAll(".modal-tab").forEach(tab=>{
  tab.addEventListener("click", ()=>{
    document.querySelectorAll(".modal-tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    const which = tab.dataset.tab;
    document.getElementById("tabPreview").style.display = which === "preview" ? "block" : "none";
    document.getElementById("tabPrompt").style.display = which === "prompt" ? "block" : "none";
    if(which === "prompt") loadPrompt(currentItemId);
  });
});

document.getElementById("modalClose").addEventListener("click", ()=>{
  document.getElementById("modalBackdrop").classList.remove("open");
});
document.getElementById("modalBackdrop").addEventListener("click", (e)=>{
  if(e.target.id === "modalBackdrop") document.getElementById("modalBackdrop").classList.remove("open");
});

pollStatus();
setInterval(pollStatus, 4000);
</script>
</body>
</html>
